name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Languages activity
          commits_authoring: Felipe, FelipeSelhorst, selhorstdelimafelipe@gmail.com
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_languages_details: lines


          # Lines of code changed
          plugin_lines: yes
          plugin_lines_delay: 30
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 3
          plugin_lines_history_limit: 3

          # Steam
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199131565286"
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_limit: 1
          plugin_steam_recent_games_limit: 1
